version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: metrocheck-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./metrocheck.db
      - JWT_SECRET=sih2026-metrocheck-super-secret-key-change-in-prod
      - AI_PROVIDER=demo
      - OCR_PROVIDER=demo
    volumes:
      - api_data:/app/apps/api
      - uploads_data:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: metrocheck-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  api_data:
  uploads_data:
