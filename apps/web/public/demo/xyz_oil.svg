      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="url(#oilbg)" stroke="#eab308" stroke-width="4"/>
  <rect x="20" y="20" width="760" height="110" rx="16" fill="#854d0e"/>
  <text x="400" y="70" font-family="Arial" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle">XYZ AGRO PURE MUSTARD OIL</text>
  <text x="400" y="100" font-family="Arial" font-weight="bold" font-size="16" fill="#fef08a" text-anchor="middle">KACHI GHANI &bull; EDIBLE VEGETABLE OIL</text>

