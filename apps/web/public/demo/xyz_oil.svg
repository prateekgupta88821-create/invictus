  <line x1="70" y1="205" x2="470" y2="205" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="70" y="240" font-family="Arial" font-size="13" fill="#64748b">Manufactured by: <tspan font-weight="bold" fill="#0f172a">XYZ Agro Mills</tspan></text>
  <text x="70" y="265" font-family="Arial" font-size="13" fill="#b91c1c">Alwar, Rajasthan (INCOMPLETE ADDRESS - NO PIN)</text>

