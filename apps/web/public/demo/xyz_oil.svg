  <text x="530" y="240" font-family="Arial" font-weight="bold" font-size="28" fill="#d97706">Price: 195</text>
  <text x="530" y="265" font-family="Arial" font-size="11" fill="#dc2626">&#9888; Missing "₹" symbol</text>
  <text x="530" y="285" font-family="Arial" font-size="11" fill="#dc2626">&#9888; Missing "incl. of all taxes"</text>
