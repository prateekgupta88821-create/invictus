  <text x="70" y="335" font-family="Arial" font-weight="bold" font-size="22" fill="#0f2942">Quantity: 1 Liter</text>

  <text x="70" y="380" font-family="Arial" font-size="13" fill="#64748b">Date of Packing: <tspan font-weight="bold" fill="#0f172a">07/2026</tspan></text>
  <text x="70" y="410" font-family="Arial" font-size="13" fill="#64748b">Batch: <tspan font-weight="bold" fill="#0f172a">MZ-99</tspan></text>
  
  <text x="70" y="460" font-family="Arial" font-size="12" fill="#dc2626">Call 9811XXXXXX for feedback (INCOMPLETE HELPLINE)</text>

