    <text x="520" y="315" font-family="Arial" font-weight="900" font-size="26" fill="#b91c1c">₹ 680.00</text>
    <text x="520" y="335" font-family="Arial" font-size="10" fill="#991b1b">M.R.P. (INCL. OF ALL TAXES)</text>
