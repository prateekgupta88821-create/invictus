<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect x="20" y="20" width="760" height="560" rx="16" fill="#fafaf9" stroke="#78716c" stroke-width="4"/>
