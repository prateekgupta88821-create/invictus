  <rect x="50" y="160" width="420" height="380" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
  <text x="70" y="200" font-family="Arial" font-weight="bold" font-size="14" fill="#1c1917">COMMODITY DETAILS</text>
  
  <text x="70" y="240" font-family="Arial" font-size="13" fill="#78716c">Packed by: <tspan font-weight="bold" fill="#0c0a09">Heritage Grain Traders</tspan></text>
  <text x="70" y="265" font-family="Arial" font-size="12" fill="#78716c">Mandi Gobindgarh, Punjab</text>
  
  <text x="70" y="320" font-family="Arial" font-size="13" fill="#78716c">Net Quantity: <tspan font-weight="bold" font-size="22" fill="#1c1917">5 kg</tspan></text>
  
  <text x="70" y="370" font-family="Arial" font-size="13" fill="#78716c">Date: 04/2026 &bull; Batch: RH-77</text>
